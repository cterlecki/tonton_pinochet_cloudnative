name: docs

# Build the MkDocs site and publish it to the dev S3 bucket behind CloudFront (infra/docs), then invalidate the cache.
on:
  push:
    branches: [main]
    paths: ["docs/**", "mkdocs.yml", "requirements-docs.txt"]
  workflow_dispatch:

permissions:
  contents: read

# A newer build supersedes an older one.
concurrency:
  group: docs
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    # The deployer role only trusts tokens issued for its environment.
    environment: dev
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-docs.txt
      - run: pip install -r requirements-docs.txt
      - run: mkdocs build --strict -d site
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ vars.AWS_REGION }}
      - name: read bucket and distribution from infra/docs outputs
        run: |
          terraform -chdir=infra/docs init -input=false -backend-config=backends/dev.hcl >/dev/null
          echo "BUCKET=$(terraform -chdir=infra/docs output -raw bucket)" >> "$GITHUB_ENV"
          echo "DIST=$(terraform -chdir=infra/docs output -raw distribution_id)" >> "$GITHUB_ENV"
          echo "URL=$(terraform -chdir=infra/docs output -raw url)" >> "$GITHUB_ENV"
      - run: aws s3 sync site "s3://$BUCKET" --delete
      - run: aws cloudfront create-invalidation --distribution-id "$DIST" --paths '/*'
      # Block scalar: a plain YAML value cannot contain ": ".
      - run: |
          echo "Docs published: $URL" >> "$GITHUB_STEP_SUMMARY"
