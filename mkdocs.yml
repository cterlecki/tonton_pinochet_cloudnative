site_name: Tonton Pinochet — cloud native
docs_dir: docs
# CloudFront only maps / to index.html, so pages must be flat files (architecture.html), not architecture/.
use_directory_urls: false
theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - navigation.sections
# Links to files outside docs/ (infra paths) warn instead of failing --strict.
validation:
  links:
    not_found: warn
    absolute_links: warn
    unrecognized_links: warn
plugins:
  - search
  - drawio
markdown_extensions:
  - tables
  - admonition
  - toc:
      permalink: true
  - pymdownx.highlight
  - pymdownx.superfences
nav:
  - Home: README.md
  - Architecture: architecture.md
  - Plan: PLAN.md
